<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的第一个网页</title>
<style>
    body {
        background-color: #f5f5f5;
        font-family: "Microsoft YaHei", sans-serif;
        color: #333333;
        margin: 0;
        padding: 40px 20px;
    }

    .card {
        max-width: 720px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
        color: #e91e63;
        margin-bottom: 8px;
    }

    h2 {
        color: #333333;
        font-size: 20px;
        margin-top: 32px;
    }

    p {
        line-height: 1.8;
    }

    ul {
       line-height: 1.9;
       padding-left: 20px;
    }

    a {
        color: #1976d2;
    }
    .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background-color: #ffe4ec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    margin: 0 auto 20px auto;
    }

    h1 {
        text-align: center;
    }

    .subtitle {
        text-align: center;
        color: #888888;
        margin-top: 0;
    }

    .tag {
        display: inline-block;
        background-color: #e8f0fe;
        color: #1976d2;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 14px;
        margin: 4px 6px 4px 0;
    }

    .tag:hover {
        background-color: #1976d2;
        color: #ffffff;
    }

    @media (max-width: 600px) {
        body {
            padding: 16px;
        }
        .card {
            padding: 24px;
        }
        h1 {
            font-size: 24px;
        }
    }
    .like-row {
    display: flex;
    align-items: center;
    gap: 12px;
    }

    .like-btn {
        border: none;
        background-color: #1976d2;
        color: #ffffff;
        font-size: 15px;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: background-color 0.2s;
    }

    .like-btn:hover {
        background-color: #1565c0;
    }

    .like-btn:active {
        transform: scale(0.96);
    }

    .like-btn.unlocked {
        background-color: #e91e63;
    }
</style>
</head>
<body>
    <div class="card">

        <div class="avatar">🐱</div>
        <h1>你好，我是 Neko</h1>
        <p class="subtitle">大二学生 · 正在从零学做网站</p>

        <h2>关于我</h2>
        <p>这是我的第一个网页喵。</p>

        <h2>我会的技能</h2>
        <p>
            <span class="tag">Python 基础</span>
            <span class="tag">HTML / CSS</span>
            <span class="tag">Git 版本控制</span>
        </p>

        <h2>给我点个赞</h2>
        <p class="like-row">
            <button class="like-btn">👍 点赞</button>
            <span class="like-count">0</span> 个赞
        </p>
        <h2>找到我</h2>
        <p><a href="https://github.com">这是我的 GitHub</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
